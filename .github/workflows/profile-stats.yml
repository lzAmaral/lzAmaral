name: Atualizar gráficos do perfil

on:
  schedule:
    - cron: '15 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gerar gráficos com dados do GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_stats.py
      - name: Publicar gráficos atualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats/*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'docs: update profile charts'
            git push origin HEAD:main
          fi
